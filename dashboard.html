<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI On-Call Engineer - Incident Command Center</title>
<style>
  :root {
    --bg: #090d16;
    --card-bg: #111827;
    --border: #1f2937;
    --accent: #38bdf8;
    --text: #f3f4f6;
    --muted: #9ca3af;
    --success: #10b981;
    --warning: #f59e0b;
    --error: #ef4444;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 2rem;
    background: var(--bg); color: var(--text);
  }
  .header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;
  }
  h1 { margin: 0; font-size: 1.6rem; font-weight: 700; }
  h1 span { color: var(--accent); }
  .nav-btns a {
    color: var(--text); text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px;
    background: var(--card-bg); border: 1px solid var(--border); font-size: 0.9rem; font-weight: 500;
    margin-left: 0.5rem; transition: border-color 0.2s;
  }
  .nav-btns a:hover { border-color: var(--accent); }

  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem;
  }
  .stat-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem;
  }
  .stat-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
  .stat-val { font-size: 1.8rem; font-weight: 700; margin-top: 0.4rem; color: var(--text); }
  
  table { border-collapse: collapse; width: 100%; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 0.9rem 1rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; background: #0f172a; }
  tr:hover { background: #1e293b; cursor: pointer; }
  
  .badge {
    padding: 0.25rem 0.65rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
    display: inline-block; white-space: nowrap;
  }
  .diagnosing { background: #78350f; color: #fde68a; }
  .pr_opened  { background: #1e3a8a; color: #bfdbfe; }
  .needs_human, .failed { background: #7f1d1d; color: #fecaca; }
  .diagnosed  { background: #4c1d95; color: #ddd6fe; }
  .resolved   { background: #064e3b; color: #a7f3d0; border: 1px solid #059669; }
  
  .code { font-family: monospace; font-size: 0.85rem; color: #cbd5e1; }
  
  .drawer-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px);
    display: none; z-index: 50;
  }
  .drawer {
    position: fixed; top: 0; right: 0; width: 560px; max-width: 90vw; height: 100vh;
    background: #0f172a; border-left: 1px solid var(--border); box-shadow: -10px 0 30px rgba(0,0,0,0.5);
    z-index: 60; padding: 2rem; overflow-y: auto; box-sizing: border-box; transform: translateX(100%);
    transition: transform 0.25s ease-out;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 1.5rem; }
  .close-btn { background: none; border: none; color: var(--muted); font-size: 1.5rem; cursor: pointer; }
  .close-btn:hover { color: var(--text); }
  
  .report-box {
    background: #1e293b; border-radius: 8px; padding: 1.25rem; font-size: 0.92rem; line-height: 1.6;
    white-space: pre-wrap; font-family: inherit; margin-top: 1rem; border: 1px solid #334155;
  }
  .pr-btn {
    display: inline-block; background: #2563eb; color: white; padding: 0.6rem 1.2rem;
    border-radius: 6px; text-decoration: none; font-weight: 600; margin-top: 1rem;
  }
  .pr-btn:hover { background: #1d4ed8; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>AI On-Call Engineer <span>Command Center</span></h1>
    <div style="color: var(--muted); font-size: 0.85rem; margin-top: 0.3rem;" id="lastUpdated">Connecting...</div>
  </div>
  <div class="nav-btns">
    <a href="/store" target="_blank">View Live Storefront &rarr;</a>
    <a href="/docs" target="_blank">FastAPI Docs</a>
  </div>
</div>

<div class="stats">
  <div class="stat-card">
    <div class="stat-title">Total Incidents</div>
    <div class="stat-val" id="totalIncidents">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-title">Auto-Resolved</div>
    <div class="stat-val" style="color: var(--success);" id="autoResolved">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-title">Pending Human Review</div>
    <div class="stat-val" style="color: var(--warning);" id="needsHuman">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-title">System Health</div>
    <div class="stat-val" style="color: var(--accent);">Operational</div>
  </div>
</div>

<table>
  <thead>
    <tr>
      <th>#</th>
      <th>Status</th>
      <th>Signature</th>
      <th>Occurrences</th>
      <th>Root Cause</th>
      <th>Pull Request</th>
      <th>Timestamp</th>
      <th>Details</th>
    </tr>
  </thead>
  <tbody id="incidentTable"></tbody>
</table>

<div class="drawer-overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <h2 id="drawerTitle" style="margin: 0; font-size: 1.25rem;">Incident Details</h2>
    <button class="close-btn" onclick="closeDrawer()">&times;</button>
  </div>
  <div id="drawerContent"></div>
</div>

<script>
var incidents = [];

function openDrawer(id) {
  var inc = incidents.find(function(i) { return i.id === id; });
  if (!inc) return;
  
  document.getElementById("drawerTitle").innerHTML = 'Incident #' + inc.id + ' <span class="badge ' + inc.status + '">' + inc.status + '</span>';
  
  var prHtml = "";
  if (inc.pr_url && inc.pr_url.indexOf("http") === 0) {
    prHtml = '<a href="' + inc.pr_url + '" target="_blank" class="pr-btn">View GitHub Pull Request &rarr;</a>';
  } else if (inc.pr_url) {
    prHtml = '<div style="color: var(--muted); font-size: 0.85rem; margin-top: 0.8rem;">PR / Merge: <code>' + inc.pr_url + '</code></div>';
  }
  
  var explanationHtml = "";
  if (inc.explanation) {
    try {
      var exp = JSON.parse(inc.explanation);
      explanationHtml = '<div style="margin-top: 1rem; padding: 0.8rem; background: #182234; border-radius: 6px; font-size: 0.85rem;">' +
        '<strong>Fix Safe to Auto-Merge:</strong> ' + (exp.safe_to_auto_fix ? 'Yes' : 'No') + '<br>' +
        '<strong>Still Present in Current Code:</strong> ' + (exp.still_present_in_current_code || 'N/A') + '<br>' +
        '<strong>Recommended Fix:</strong> ' + (exp.recommended_fix || 'N/A') +
        '</div>';
    } catch(e) {}
  }

  document.getElementById("drawerContent").innerHTML = 
    '<div style="margin-bottom: 1rem;">' +
      '<div style="font-size: 0.8rem; color: var(--muted); text-transform: uppercase;">Error Signature</div>' +
      '<div class="code" style="margin-top: 0.2rem; font-size: 1rem; color: var(--accent);">' + (inc.signature || 'N/A') + '</div>' +
    '</div>' +
    '<div style="margin-bottom: 1rem;">' +
      '<div style="font-size: 0.8rem; color: var(--muted); text-transform: uppercase;">Root Cause</div>' +
      '<div style="margin-top: 0.2rem;">' + (inc.root_cause || 'Under investigation...') + '</div>' +
      explanationHtml +
      prHtml +
    '</div>' +
    '<div style="margin-top: 1.5rem;">' +
      '<div style="font-size: 0.8rem; color: var(--muted); text-transform: uppercase;">Founder & SRE Incident Report</div>' +
      '<div class="report-box">' + (inc.report || 'No detailed report recorded.') + '</div>' +
    '</div>';
  
  document.getElementById("overlay").style.display = "block";
  document.getElementById("drawer").classList.add("open");
}

function closeDrawer() {
  document.getElementById("overlay").style.display = "none";
  document.getElementById("drawer").classList.remove("open");
}

async function fetchIncidents() {
  try {
    var res = await fetch("/api/incidents");
    incidents = await res.json();
    
    document.getElementById("totalIncidents").textContent = incidents.length;
    document.getElementById("autoResolved").textContent = incidents.filter(function(i) { return i.status === "resolved"; }).length;
    document.getElementById("needsHuman").textContent = incidents.filter(function(i) { return i.status === "needs_human" || i.status === "pr_opened"; }).length;
    
    var tbody = document.getElementById("incidentTable");
    tbody.innerHTML = "";
    incidents.forEach(function(inc) {
      var tr = document.createElement("tr");
      tr.onclick = function() { openDrawer(inc.id); };
      
      var prText = (inc.pr_url && inc.pr_url.indexOf("http") === 0) 
        ? '<a href="' + inc.pr_url + '" target="_blank" onclick="event.stopPropagation()">View PR</a>'
        : (inc.pr_url ? 'Auto-Merged' : '-');
      
      var timeFormatted = inc.last_seen ? new Date(inc.last_seen).toLocaleTimeString() : (inc.created_at ? new Date(inc.created_at).toLocaleTimeString() : '-');
      
      tr.innerHTML = 
        '<td style="font-weight: 700;">#' + inc.id + '</td>' +
        '<td><span class="badge ' + inc.status + '">' + inc.status + '</span></td>' +
        '<td class="code">' + inc.signature + '</td>' +
        '<td>' + inc.occurrences + '</td>' +
        '<td style="max-width: 320px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">' + (inc.root_cause || '-') + '</td>' +
        '<td>' + prText + '</td>' +
        '<td style="color: var(--muted); font-size: 0.85rem;">' + timeFormatted + '</td>' +
        '<td><button style="background: none; border: 1px solid var(--border); color: var(--accent); padding: 0.25rem 0.5rem; border-radius: 4px; cursor: pointer;">View &rarr;</button></td>';
      tbody.appendChild(tr);
    });
    
    document.getElementById("lastUpdated").textContent = "Live sync active • Last checked: " + new Date().toLocaleTimeString();
  } catch (err) {
    document.getElementById("lastUpdated").textContent = "Connection to server lost. Retrying...";
  }
}

fetchIncidents();
setInterval(fetchIncidents, 3000);

async function triggerDemoBreak() {
  try {
    const res = await fetch('/api/demo/break', { method: 'POST' });
    const data = await res.json();
    alert("🚨 Outage Simulated!\n'price' key removed from products catalog.\nCheckout will now fail 500.");
  } catch (err) {
    alert('Failed: ' + err);
  }
}

async function triggerDemoReset() {
  try {
    const res = await fetch('/api/demo/reset', { method: 'POST' });
    const data = await res.json();
    alert("✅ Healthy Code Restored!\nCheckout is now working.");
  } catch (err) {
    alert('Failed: ' + err);
  }
}
</script>

<!-- Judge Demo Controls Toolbar -->
<div style="position: fixed; bottom: 20px; right: 20px; background: rgba(15, 23, 42, 0.95); border: 1px solid #38bdf8; border-radius: 12px; padding: 12px 18px; display: flex; align-items: center; gap: 12px; z-index: 9999; box-shadow: 0 10px 25px rgba(0,0,0,0.6); backdrop-filter: blur(8px);">
  <span style="font-size: 0.85rem; font-weight: 700; color: #38bdf8; letter-spacing: 0.5px;">DEMO CONTROLS:</span>
  <button onclick="triggerDemoBreak()" style="background: #ef4444; color: white; border: none; padding: 7px 14px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; cursor: pointer;">🚨 Break Checkout</button>
  <button onclick="triggerDemoReset()" style="background: #22c55e; color: white; border: none; padding: 7px 14px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; cursor: pointer;">🔄 Reset Code</button>
</div>

</body>
</html>
