<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incidents</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; background: #0f172a; color: #e2e8f0; }
  h1 { margin: 0 0 .25rem; }
  .sub { color: #94a3b8; margin-bottom: 1.25rem; font-size: .9rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .6rem .8rem; border-bottom: 1px solid #1e293b; vertical-align: top; }
  th { color: #94a3b8; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; }
  .badge { padding: .15rem .6rem; border-radius: 999px; font-size: .8rem; font-weight: 600;
           background: #334155; color: #e2e8f0; white-space: nowrap; }
  .diagnosing { background: #78350f; color: #fde68a; }
  .pr_opened  { background: #1e3a8a; color: #bfdbfe; }
  .failed     { background: #7f1d1d; color: #fecaca; }
    .diagnosed  { background: #4c1d95; color: #ddd6fe; }
  .merged, .resolved { background: #14532d; color: #bbf7d0; }
  .muted { color: #94a3b8; font-size: .85rem; margin-top: .2rem; }
  a { color: #7dd3fc; }
  .empty { color: #94a3b8; padding: 1rem 0; }
</style>
</head>
<body>
  <h1>Incidents</h1>
  <div class="sub" id="status">Loading...</div>
  <table>
    <thead>
      <tr><th>#</th><th>Status</th><th>Error</th><th>Count</th><th>Root cause</th><th>Pull request</th><th>Last seen</th></tr>
    </thead>
    <tbody id="body"></tbody>
  </table>
  <div class="empty" id="empty" hidden>No incidents yet. All quiet.</div>

<script>
function cell(text) {
  const td = document.createElement("td");
  td.textContent = text ?? "";
  return td;
}

function statusCell(status) {
  const td = document.createElement("td");
  const s = document.createElement("span");
  s.className = "badge " + String(status || "").replace(/[^a-z_]/gi, "");
  s.textContent = status || "unknown";
  td.appendChild(s);
  return td;
}

function causeCell(r) {
  const td = document.createElement("td");
  td.textContent = r.root_cause || "Investigating...";
  if (r.explanation) {
    let info = null;
    try { info = JSON.parse(r.explanation); } catch (e) {}
    const d = document.createElement("div");
    d.className = "muted";
    if (info && typeof info === "object") {
      const parts = [];
      if (info.recommended_fix) parts.push("Recommended fix: " + info.recommended_fix);
      if (info.still_present_in_current_code) parts.push("Still in current code: " + info.still_present_in_current_code);
      if (info.safe_to_auto_fix !== undefined) parts.push("Safe to auto-fix: " + info.safe_to_auto_fix);
      d.textContent = parts.join(" · ");
    } else {
      d.textContent = r.explanation;
    }
    td.appendChild(d);
  }
  return td;
}

function prCell(url) {
  const td = document.createElement("td");
  if (typeof url === "string" && /^https:\/\//.test(url)) {
    const a = document.createElement("a");
    a.href = url; a.target = "_blank"; a.rel = "noopener";
    a.textContent = "View PR";
    td.appendChild(a);
  } else {
    td.textContent = "-";
  }
  return td;
}

function timeText(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleTimeString();
}

async function refresh() {
  const status = document.getElementById("status");
  try {
    const res = await fetch("/api/incidents");
    const rows = await res.json();
    const body = document.getElementById("body");
    body.innerHTML = "";
    rows.forEach(r => {
      const tr = document.createElement("tr");
      tr.appendChild(cell(r.id));
      tr.appendChild(statusCell(r.status));
      tr.appendChild(cell(r.signature));
      tr.appendChild(cell(r.occurrences));
      tr.appendChild(causeCell(r));
      tr.appendChild(prCell(r.pr_url));
      tr.appendChild(cell(timeText(r.last_seen)));
      body.appendChild(tr);
    });
    document.getElementById("empty").hidden = rows.length > 0;
    status.textContent = "Updated " + new Date().toLocaleTimeString() + " - refreshes every 3 seconds";
  } catch (e) {
    status.textContent = "Cannot reach the API. Is the server running?";
  }
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
