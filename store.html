<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopAPI Storefront</title>
<style>
  :root {
    --bg: #090d16; --panel: #0f172a; --card: #131b2e; --border: #23314e; --accent: #38bdf8;
    --text: #f1f5f9; --muted: #94a3b8; --ok: #22c55e; --bad: #ef4444; --warn: #f59e0b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .demo-bar { background: var(--panel); border-bottom: 1px solid #7c3aed; padding: 0.7rem 1.5rem; }
  .row { display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; margin: 0.25rem 0; }
  .label { font-weight: 700; color: #a78bfa; letter-spacing: 0.04em; text-transform: uppercase; font-size: 0.8rem; }
  .demo-btn { border: none; color: #fff; font-weight: 700; font-size: 0.82rem; padding: 7px 14px;
              border-radius: 6px; cursor: pointer; }
  .demo-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .break { background: #ef4444; } .reset { background: #16a34a; } .traffic { background: #475569; }
  .traffic.on { background: #7c3aed; }
  .counter { font-size: 0.82rem; color: var(--muted); }
  .counter b { color: var(--ok); } .counter b.bad { color: var(--bad); }
  .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600;
          background: #1e293b; color: var(--muted); border: 1px solid var(--border); }
  .pill[hidden] { display: none; }
  .pill.ok { background: #064e3b; color: #a7f3d0; border-color: #059669; }
  .pill.bad { background: #7f1d1d; color: #fecaca; border-color: #dc2626; }
  .pill.warn { background: #78350f; color: #fde68a; border-color: #d97706; }

  header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 1rem 1.5rem;
           display: flex; justify-content: space-between; align-items: center; }
  .brand { font-size: 1.3rem; font-weight: 700; } .brand span { color: var(--accent); }
  .nav-link { color: var(--muted); text-decoration: none; margin-left: 1.2rem; font-size: 0.95rem; }
  .nav-link:hover { color: var(--text); } .nav-link[hidden] { display: none; }

  .container { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; display: grid;
               grid-template-columns: 2fr 1fr; gap: 2rem; }
  @media (max-width: 800px) { .container { grid-template-columns: 1fr; } }
  h2 { margin-top: 0; font-size: 1.4rem; border-bottom: 1px solid var(--border); padding-bottom: 0.7rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1.2rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem;
          display: flex; flex-direction: column; justify-content: space-between; }
  .card:hover { border-color: var(--accent); }
  .card h3 { margin: 0 0 0.4rem; font-size: 1.05rem; }
  .price { font-size: 1.3rem; font-weight: 700; color: var(--accent); margin-bottom: 1rem; }
  button.main { background: #0284c7; color: #fff; border: none; padding: 0.65rem 1rem; border-radius: 8px;
                font-weight: 600; cursor: pointer; }
  button.main:hover { background: #0369a1; } button.main:disabled { opacity: 0.5; cursor: not-allowed; }
  .cart-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
              padding: 1.4rem; position: sticky; top: 1rem; }
  .cart-item { display: flex; justify-content: space-between; padding: 0.5rem 0;
               border-bottom: 1px solid var(--border); font-size: 0.95rem; }
  .cart-total { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 700; margin: 1.3rem 0 1rem; }
  .pay { width: 100%; background: #16a34a !important; font-size: 1.1rem; padding: 0.8rem !important; }
  .muted { color: var(--muted); }

  #toast { position: fixed; top: 1rem; right: 1rem; max-width: 440px; padding: 1rem 1.4rem; border-radius: 8px;
           font-weight: 600; display: none; z-index: 10000; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
  .t-ok { background: var(--ok); color: #fff; } .t-bad { background: var(--bad); color: #fff; }
</style>
</head>
<body>

<div class="demo-bar">
  <div class="row">
    <span class="label">Demo controls</span>
    <button id="breakBtn" class="demo-btn break" onclick="demoAction('/api/demo/break')">Break Checkout</button>
    <button id="resetBtn" class="demo-btn reset" onclick="demoAction('/api/demo/reset')">Reset Code</button>
    <button id="trafficBtn" class="demo-btn traffic" onclick="toggleTraffic()">Auto traffic: OFF</button>
    <span class="counter">Orders OK <b id="okCount">0</b></span>
    <span class="counter">Failed <b id="failCount" class="bad">0</b></span>
    <span class="counter">Unreachable <b id="offCount" class="bad">0</b></span>
  </div>
  <div class="row">
    <span class="pill" id="livePill">Live site: checking...</span>
    <span class="pill" id="ghPill">GitHub main: checking...</span>
    <span class="pill warn" id="deployPill" hidden>GitHub is ahead of the live site: Render is deploying</span>
  </div>
</div>

<header>
  <div class="brand">Shop<span>API</span> Storefront</div>
  <div>
    <a id="dashLink" class="nav-link" target="_blank" hidden>Incident Dashboard &rarr;</a>
    <a href="/docs" class="nav-link" target="_blank">API Docs</a>
  </div>
</header>

<div class="container">
  <div>
    <h2>Available Products</h2>
    <div class="grid" id="productGrid"><div class="muted">Loading catalog...</div></div>
  </div>
  <div>
    <div class="cart-box">
      <h2>Your Cart</h2>
      <div id="cartItems"><p class="muted">Your cart is empty.</p></div>
      <div class="cart-total"><span>Total:</span><span id="cartTotal">INR 0</span></div>
      <button class="main pay" id="payBtn" onclick="checkout()" disabled>Pay &amp; Checkout</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let products = [];
let cart = [];
let toastTimer = null;

function toast(msg, isError) {
  const t = $("toast");
  t.textContent = msg;
  t.className = isError ? "t-bad" : "t-ok";
  t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = "none"; }, 7000);
}

function priceOf(p) {
  if (!p) return 0;
  if (p.price !== undefined) return p.price;
  if (p.cost !== undefined) return p.cost;  // the broken catalog still displays
  return 0;
}

function renderProducts() {
  const grid = $("productGrid");
  grid.textContent = "";
  products.forEach((p) => {
    const card = document.createElement("div");
    card.className = "card";
    const info = document.createElement("div");
    const h3 = document.createElement("h3");
    h3.textContent = p.name;
    const price = document.createElement("div");
    price.className = "price";
    price.textContent = "INR " + priceOf(p);
    info.appendChild(h3);
    info.appendChild(price);
    const btn = document.createElement("button");
    btn.className = "main";
    btn.textContent = "Add to Cart";
    btn.onclick = () => addToCart(p.id);
    card.appendChild(info);
    card.appendChild(btn);
    grid.appendChild(card);
  });
}

function renderCart() {
  const box = $("cartItems");
  box.textContent = "";
  if (cart.length === 0) {
    const p = document.createElement("p");
    p.className = "muted";
    p.textContent = "Your cart is empty.";
    box.appendChild(p);
    $("cartTotal").textContent = "INR 0";
    $("payBtn").disabled = true;
    return;
  }
  let total = 0;
  cart.slice(-6).forEach((item) => {
    const p = products.find((x) => x.id === item.product_id);
    const line = priceOf(p) * item.quantity;
    const row = document.createElement("div");
    row.className = "cart-item";
    const a = document.createElement("span");
    a.textContent = (p ? p.name : "Product #" + item.product_id) + " (x" + item.quantity + ")";
    const b = document.createElement("span");
    b.textContent = "INR " + line;
    row.appendChild(a);
    row.appendChild(b);
    box.appendChild(row);
  });
  cart.forEach((item) => {
    total += priceOf(products.find((x) => x.id === item.product_id)) * item.quantity;
  });
  if (cart.length > 6) {
    const more = document.createElement("div");
    more.className = "muted";
    more.textContent = "+ " + (cart.length - 6) + " more items";
    box.appendChild(more);
  }
  $("cartTotal").textContent = "INR " + total;
  $("payBtn").disabled = false;
}

async function loadProducts() {
  try {
    products = await (await fetch("/products")).json();
    renderProducts();
  } catch (e) {
    $("productGrid").textContent = "Failed to load products";
  }
}

async function loadCart() {
  try {
    cart = (await (await fetch("/cart")).json()).items || [];
    renderCart();
  } catch (e) { /* ignore */ }
}

async function addToCart(id) {
  try {
    const res = await fetch("/cart", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ product_id: id, quantity: 1 }),
    });
    if (res.ok) toast("Added to cart", false);
    else toast("Could not add item (" + res.status + ")", true);
    loadCart();
  } catch (e) {
    toast("Could not add item: " + e, true);
  }
}

async function checkout() {
  const btn = $("payBtn");
  btn.disabled = true;
  btn.textContent = "Processing...";
  try {
    const res = await fetch("/checkout", { method: "POST" });
    let data = {};
    try { data = await res.json(); } catch (e) { /* not json */ }
    if (res.ok) toast("PAID: payment successful. Total INR " + data.total, false);
    else toast("CHECKOUT FAILED (" + res.status + "): " + (data.detail || "server error"), true);
  } catch (e) {
    toast("CHECKOUT FAILED: server unreachable", true);
  } finally {
    btn.textContent = "Pay & Checkout";
    loadCart();
  }
}

/* ---------- demo controls ---------- */
async function demoAction(path) {
  const b = $("breakBtn"), r = $("resetBtn");
  b.disabled = true;
  r.disabled = true;
  try {
    const res = await fetch(path, { method: "POST" });
    let data = {};
    try { data = await res.json(); } catch (e) { /* not json */ }
    toast(data.message || data.detail || ("Request failed (" + res.status + ")"), !res.ok);
    pollStatus();
  } catch (e) {
    toast("Request failed: " + e, true);
  } finally {
    b.disabled = false;
    r.disabled = false;
  }
}

let trafficTimer = null, needItem = true, okCount = 0, failCount = 0, offCount = 0;

function updateCounters() {
  $("okCount").textContent = okCount;
  $("failCount").textContent = failCount;
  $("offCount").textContent = offCount;
}

async function trafficTick() {
  try {
    if (needItem) {
      await fetch("/cart", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ product_id: 1, quantity: 1 }),
      });
      needItem = false;
    }
    const res = await fetch("/checkout", { method: "POST" });
    if (res.ok) { okCount++; needItem = true; }
    else if (res.status === 400) { needItem = true; }
    else { failCount++; }
  } catch (e) {
    offCount++;
    needItem = true;
  }
  updateCounters();
  loadCart();
}

function toggleTraffic() {
  const btn = $("trafficBtn");
  if (trafficTimer) {
    clearInterval(trafficTimer);
    trafficTimer = null;
    btn.textContent = "Auto traffic: OFF";
    btn.classList.remove("on");
  } else {
    trafficTick();
    trafficTimer = setInterval(trafficTick, 2000);
    btn.textContent = "Auto traffic: ON";
    btn.classList.add("on");
  }
}

async function pollStatus() {
  const live = $("livePill"), gh = $("ghPill"), dep = $("deployPill");
  try {
    const s = await (await fetch("/api/status")).json();
    live.textContent = "Live site: " + (s.healthy ? "HEALTHY" : "BROKEN") + " (" + s.live_commit + ")";
    live.className = "pill " + (s.healthy ? "ok" : "bad");
    if (s.github) {
      gh.textContent = "GitHub main: " + s.github.sha + " \u2013 " + s.github.message;
      gh.className = "pill";
    } else {
      gh.textContent = "GitHub main: unavailable (is GITHUB_TOKEN set?)";
      gh.className = "pill";
    }
    dep.hidden = !s.deploying;
  } catch (e) {
    live.textContent = "Live site: restarting...";
    live.className = "pill warn";
  }
}

fetch("/api/config").then((r) => r.json()).then((c) => {
  if (c.dashboard_url) {
    const a = $("dashLink");
    a.href = c.dashboard_url;
    a.hidden = false;
  }
}).catch(() => {});

loadProducts().then(loadCart);
pollStatus();
setInterval(pollStatus, 5000);
</script>
</body>
</html>
