<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Demo - Storefront</title>
<style>
  :root {
    --bg: #090d16;
    --card-bg: #131b2e;
    --border: #23314e;
    --accent: #38bdf8;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --success: #22c55e;
    --error: #ef4444;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
  }
  header {
    background: #0f172a; border-bottom: 1px solid var(--border);
    padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center;
  }
  .brand { font-size: 1.3rem; font-weight: 700; color: var(--text); }
  .brand span { color: var(--accent); }
  .nav-link { color: var(--muted); text-decoration: none; margin-left: 1.5rem; font-size: 0.95rem; }
  .nav-link:hover { color: var(--text); }
  .nav-badge { background: #3b82f6; color: white; padding: 0.2rem 0.5rem; border-radius: 999px; font-size: 0.8rem; margin-left: 0.3rem; }
  
  .container { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; }
  @media(max-width: 800px) { .container { grid-template-columns: 1fr; } }
  
  h2 { margin-top: 0; font-size: 1.4rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; }
  .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.25rem; }
  .card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.25rem; display: flex; flex-direction: column; justify-content: space-between;
    transition: transform 0.2s;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .card h3 { margin: 0 0 0.5rem; font-size: 1.1rem; }
  .card .price { font-size: 1.3rem; font-weight: 700; color: var(--accent); margin-bottom: 1rem; }
  
  button {
    background: #0284c7; color: white; border: none; padding: 0.65rem 1rem;
    border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s;
  }
  button:hover { background: #0369a1; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  
  .cart-box {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.5rem; position: sticky; top: 2rem;
  }
  .cart-item { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
  .cart-total { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 700; margin: 1.5rem 0 1rem; }
  .checkout-btn { width: 100%; background: #16a34a; font-size: 1.1rem; padding: 0.8rem; }
  .checkout-btn:hover { background: #15803d; }
  
  #toast {
    position: fixed; bottom: 2rem; right: 2rem; padding: 1rem 1.5rem; border-radius: 8px;
    font-weight: 600; display: none; z-index: 100;
  }
  .toast-success { background: var(--success); color: white; }
  .toast-error { background: var(--error); color: white; box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4); }
</style>
</head>
<body>

<header>
  <div class="brand">Shop<span>API</span> Storefront</div>
  <div>
    <a href="/dashboard" class="nav-link" target="_blank">Incident Dashboard <span class="nav-badge">Live</span></a>
    <a href="/docs" class="nav-link" target="_blank">API Docs</a>
  </div>
</header>

<div class="container">
  <div>
    <h2>Available Products</h2>
    <div class="product-grid" id="productGrid">
      <div style="color: var(--muted)">Loading catalog...</div>
    </div>
  </div>

  <div>
    <div class="cart-box">
      <h2>Your Cart</h2>
      <div id="cartItems">
        <p style="color: var(--muted)">Your cart is empty.</p>
      </div>
      <div class="cart-total">
        <span>Total:</span>
        <span id="cartTotal">INR 0</span>
      </div>
      <button class="checkout-btn" id="checkoutBtn" onclick="checkout()" disabled>Pay & Checkout</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let products = [];
let cart = [];

function showToast(msg, isError) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = isError ? "toast-error" : "toast-success";
  t.style.display = "block";
  setTimeout(function() { t.style.display = "none"; }, 4000);
}

async function loadProducts() {
  try {
    const res = await fetch("/products");
    products = await res.json();
    const grid = document.getElementById("productGrid");
    grid.innerHTML = "";
    products.forEach(function(p) {
      const card = document.createElement("div");
      card.className = "card";
      const displayPrice = p.price !== undefined ? p.price : (p.cost !== undefined ? p.cost : "N/A");
      card.innerHTML = '<div><h3>' + p.name + '</h3><div class="price">INR ' + displayPrice + '</div></div><button onclick="addToCart(' + p.id + ')">Add to Cart</button>';
      grid.appendChild(card);
    });
  } catch (err) {
    document.getElementById("productGrid").innerHTML = "<p style='color:red'>Failed to load products</p>";
  }
}

async function loadCart() {
  try {
    const res = await fetch("/cart");
    const data = await res.json();
    cart = data.items || [];
    renderCart();
  } catch (e) {}
}

function renderCart() {
  const container = document.getElementById("cartItems");
  const checkoutBtn = document.getElementById("checkoutBtn");
  if (cart.length === 0) {
    container.innerHTML = '<p style="color: var(--muted)">Your cart is empty.</p>';
    document.getElementById("cartTotal").textContent = "INR 0";
    checkoutBtn.disabled = true;
    return;
  }
  container.innerHTML = "";
  let total = 0;
  cart.forEach(function(item) {
    const p = products.find(function(prod) { return prod.id === item.product_id; }) || { name: "Product #" + item.product_id, price: 0, cost: 0 };
    const price = p.price !== undefined ? p.price : (p.cost || 0);
    total += price * item.quantity;
    const row = document.createElement("div");
    row.className = "cart-item";
    row.innerHTML = '<span>' + p.name + ' (x' + item.quantity + ')</span><span>INR ' + (price * item.quantity) + '</span>';
    container.appendChild(row);
  });
  document.getElementById("cartTotal").textContent = "INR " + total;
  checkoutBtn.disabled = false;
}

async function addToCart(productId) {
  try {
    const res = await fetch("/cart", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ product_id: productId, quantity: 1 })
    });
    if (res.ok) {
      showToast("Added item to cart!", false);
      loadCart();
    }
  } catch (err) {
    showToast("Failed to add item", true);
  }
}

async function checkout() {
  const btn = document.getElementById("checkoutBtn");
  btn.disabled = true;
  btn.textContent = "Processing...";
  try {
    const res = await fetch("/checkout", { method: "POST" });
    const data = await res.json();
    if (res.status === 200) {
      showToast("Payment Successful! Total: INR " + data.total, false);
      cart = [];
      renderCart();
    } else {
      showToast("500 Server Error: " + (data.detail || "Checkout crashed!"), true);
    }
  } catch (err) {
    showToast("Network / Server Error: " + err, true);
  } finally {
    btn.disabled = false;
    btn.textContent = "Pay & Checkout";
    loadCart();
  }
}

loadProducts().then(loadCart);
</script>
</body>
</html>
